<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous" />

    <title>{% block title %} {% endblock %}</title>
    <style>
        
        {% block css %}
        <style>
        /* Carousel Item Layout */
        .container{
          max-width: 64%;
        }
        .carousel-inner {
            display: flex;
            flex-wrap: nowrap;
            overflow: hidden;
            width: fit-content;
        }
        .carousel-item {
            transition: transform 0.5s ease-in-out;
        }
        .carousel-item .row {
            display: flex;
            justify-content: space-around;
            flex-wrap: nowrap;
        }
        .card {
            margin: 15px auto;
            width: 90%; /* Ensure consistent width */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            
        }
        .card-img-top {
            width: 49%;
            height: 291px;
            object-fit: cover;
           
        }
        .card-body {
            padding: 10px;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #343a40;
        }
        .card-text {
            font-size: 14px;
            color: #6c757d;
        }
        .btn-primary {
            background-color: #ff0078;;
            border: none;
            margin: 5px;
        }
        .btn-secondary {
            background-color: #6c757d;
            border: none;
            margin: 5px;
        }
        
        /* Carousel Controls */
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            background-color: #007bff;
            border-radius: 50%;
            padding: 10px;
        }
        .carousel-control-prev,
        .carousel-control-next {
            width: 5%;
            top: 50%;
            transform: translateY(-50%);
        }
        .carousel-indicators li {
            background-color: #6c757d;
        }
        .carousel-indicators .active {
            background-color: #007bff;
        }
        .bg-dark {
          background-color: #ff0078;
      }
      
        </style>
        {% endblock %}
        
  

    </head>
    <body>
      
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/shop">Trendy Threads</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
  
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mr-auto">
            <li class="nav-item active">
              <a class="nav-link" href="/shop">Home <span class="sr-only">(current)</span></a>
            </li>

            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="about">About Us</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="tracker">Tracker</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="contact">Contact Us</a>
            </li>
             <li class="nav-item" >
              <a class="nav-link mr-sm-2" aria-current="page" href="checkout">My Choice(<span id = "cart">0</span>)</a>
            </li> 
          </ul>
           <form  method="get" action="/shop/search/" class="form-inline my-2 my-lg-0">
            <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search" 
            name="search" id="search"/>
            <button  name="search" id="search" class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
          </form>
        </div>
      </nav>
      {% block body %} {% endblock %}


      

       <!-- Optional JavaScript -->
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.6/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
    {% block  js %}{% endblock  %}
  </body>
</html>
